# Panel VM: Postgres + panel. The panel has no public port: Cloudflare Tunnel
# reaches it on the compose network. 127.0.0.1:3000 is for admin use over SSH only.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamepanel
      POSTGRES_DB: gamepanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamepanel"]
      interval: 5s
      retries: 10

  panel:
    build:
      context: ../..
      dockerfile: deploy/panel/Dockerfile
    image: gamepanel-panel:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gamepanel:${POSTGRES_PASSWORD}@db:5432/gamepanel
      APP_SECRET: ${APP_SECRET:?set in .env}
      SERVER_DOMAIN: ${SERVER_DOMAIN:-mc.daemonscripts.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Starts once TUNNEL_TOKEN is in .env:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [panel]

volumes:
  pgdata:
